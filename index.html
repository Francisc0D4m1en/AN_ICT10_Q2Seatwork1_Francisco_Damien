<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT List Demo</title>
    <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!--Google Lexend Font-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap">
    <!--PyScript-->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.2/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.2/core.js"></script>
    <script type="py" src="main.py"></script>

	<style></style>
</head>
<body class="container mt-5 bg-warning">
    <div class="mx-auto w-50 text-center mb-4 bg-light p-3 rounded">
        <h1>SS Club Admissions</h1>
        <img src="logoimg.png" alt="SS Club Logo" class="img-fluid rounded-circle mb-3" style="width: 150px; height: 150px;">
        <h6 class="mb-1">Please input the desired details:</h6>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <input type="text" id="user_input" placeholder="Enter First Name" class="form-control">
            </div>
            <div class="col-md-6">
                <input type="text" id="user_input2" placeholder="Enter Last Name" class="form-control">
            </div>
        </div>

        <button type="button" class="btn btn-success" py-click="applicant_search">Insert</button>
         <p class="text-muted mt-4">"A nation reveals itself not only by the men it produces but also by the men it honors, the men it remembers."</p>
         <p class="text-muted">- John F. Kennedy, 1963</p>
    </div>
    <div class="align-middle mx-auto w-50 text-center bg-light p-3 rounded">
        <h3 class="mt-4 mb-3">Admission status:</h3>
        <div id="output"></div>
        <p id="message"></p>

    </div>
    
</body>
</html>
